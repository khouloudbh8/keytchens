    <script>
        (function() {
            if (localStorage.getItem("selectedLanguage") === null) {
                fetch("https://ipwho.is/")
                    .then(res => res.json())
                    .then(data => {
                        if (data.country_code !== "FR") {
                            localStorage.setItem('selectedLanguage', 'en')
                            window.location.href = "/en/blog.html";
                        } else {
                            localStorage.setItem('selectedLanguage', 'fr')
                        }
                    })
                    .catch(() => {
                        localStorage.setItem('selectedLanguage', 'en')
                        window.location.href = "/en/blog.html"
                    });
            }
        })();
    </script>

    <style>
        /* Animation d'apparition des cartes */
        @keyframes kc-fade-up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .kc-fade-up {
            opacity: 0;
            animation: kc-fade-up 0.7s ease-out forwards;
        }

        /* Dépliage du contenu complet */
        .kc-full-content {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
        }
        .kc-full-content > div {
            overflow: hidden;
        }
        .kc-full-content.kc-open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 1.25rem;
        }
        .kc-toggle-icon {
            transition: transform 0.25s ease;
        }
        .kc-toggle-open .kc-toggle-icon {
            transform: rotate(90deg);
        }

        /* Limite le nombre de lignes affichées (titre/extrait) pour uniformiser la hauteur des cards */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            .kc-fade-up { animation: none; opacity: 1; }
            .kc-full-content, .kc-toggle-icon { transition: none; }
        }

        /* --- Boutons de partage --- */
        .kc-share-btn {
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: #9ca3af;
            background: transparent;
            transition: all .2s ease;
        }
        .kc-share-btn:hover {
            transform: translateY(-2px);
        }
        .kc-share-fb:hover {
            background: #1877F2;
            color: #fff;
        }
        .kc-share-li:hover {
            background: #0A66C2;
            color: #fff;
        }
        .kc-share-ig:hover {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            color: #fff;
        }

        /* Toast de confirmation (copie de lien Instagram) */
        #kc-toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111827;
            color: #fff;
            padding: .6rem 1.2rem;
            border-radius: .5rem;
            font-size: .875rem;
            opacity: 0;
            pointer-events: none;
            transition: all .25s ease;
            z-index: 100;
            white-space: nowrap;
            max-width: 90vw;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #kc-toast.kc-show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- Skeleton loader (cartes de chargement) --- */
        .kc-skeleton {
            position: relative;
            overflow: hidden;
            background-color: #e5e7eb;
        }
        .dark .kc-skeleton {
            background-color: #374151;
        }
        .kc-skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            animation: kc-shimmer 1.5s infinite;
        }
        .dark .kc-skeleton::after {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }
        @keyframes kc-shimmer {
            100% { transform: translateX(100%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .kc-skeleton::after { animation: none; }
        }
    </style>

<!-- LOGIQUE DU BLOG                                               -->
<!-- Les articles sont récupérés depuis l'API Symfony/MongoDB.     -->
<!-- Le clic sur "Lire l'article" déplie le paragraphe complet     -->
<!-- directement dans la card (pas de page ni de modal).           -->
<!-- Chaque card propose aussi un partage Facebook / LinkedIn /    -->
<!-- Instagram (copie de lien + description, Instagram n'ayant pas -->
<!-- d'API de partage web).                                        -->
<!-- Pendant le chargement des articles, des squelettes (skeleton) -->
<!-- sont affichés à la place d'un espace blanc.                   -->
<!-- ============================================================ -->
<script type="module">
    const API_BASE = 'http://localhost:8000/api'; // à adapter en production
    const SKELETON_COUNT = 4; // nombre de cartes fantômes affichées pendant le chargement

    // --- 1. SOURCE DE DONNÉES ---
    async function getArticles() {
        try {
            const res = await fetch(`${API_BASE}/articles`);
            if (!res.ok) return [];
            return await res.json();
        } catch (e) {
            console.error('Erreur API:', e);
            return [];
        }
    }

    // --- 2. UTILITAIRES ---
    function formatDate(isoDate) {
        return new Date(isoDate).toLocaleDateString('fr-FR', {
            day: 'numeric', month: 'long', year: 'numeric'
        });
    }

    // --- 2bis. SQUELETTE DE CHARGEMENT ---
    // Reproduit la structure d'une card d'article, mais avec des blocs gris
    // animés (effet "shimmer") à la place du texte et de l'image.
    function skeletonCardHTML(index) {
        return `
            <article
               class="flex flex-col overflow-hidden bg-white border border-gray-100 rounded-2xl shadow-sm dark:bg-gray-800 dark:border-gray-700"
               aria-hidden="true">
                <div class="kc-skeleton h-48 w-full"></div>
                <div class="flex flex-col flex-1 p-6">
                    <div class="kc-skeleton h-3 w-24 rounded mb-3"></div>
                    <div class="kc-skeleton h-5 w-full rounded mb-2"></div>
                    <div class="kc-skeleton h-5 w-2/3 rounded mb-3"></div>
                    <div class="kc-skeleton h-3 w-full rounded mb-2"></div>
                    <div class="kc-skeleton h-3 w-full rounded mb-2"></div>
                    <div class="kc-skeleton h-3 w-1/2 rounded"></div>
                    <div class="mt-4 flex items-center justify-between">
                        <div class="kc-skeleton h-4 w-28 rounded"></div>
                        <div class="flex items-center gap-1">
                            <div class="kc-skeleton w-8 h-8 rounded-full"></div>
                            <div class="kc-skeleton w-8 h-8 rounded-full"></div>
                            <div class="kc-skeleton w-8 h-8 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </article>
        `;
    }

    function renderSkeletons(count = SKELETON_COUNT) {
        const grid = document.getElementById('blog-grid');
        grid.innerHTML = Array.from({ length: count }, (_, i) => skeletonCardHTML(i)).join('');
    }

    function articleCardHTML(article, index) {
        return `
            <article
               class="kc-fade-up flex flex-col overflow-hidden bg-white border border-gray-100 rounded-2xl shadow-sm transition-all duration-300 hover:shadow-xl hover:border-primary/30 dark:bg-gray-800 dark:border-gray-700"
               style="animation-delay: ${0.05 * index}s">
                <div class="relative overflow-hidden h-48">
                    <img src="${article.image}" alt="${article.title}"
                         class="object-cover w-full h-full transition-transform duration-500 hover:scale-105"
                         loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-darkblue/30 via-transparent to-transparent"></div>
                </div>
                <div class="flex flex-col flex-1 p-6">
                    <time datetime="${article.date}" class="mb-3 text-xs font-medium text-gray-400 dark:text-gray-500">
                        ${formatDate(article.date)}
                    </time>
                    <h3 class="mb-2 text-lg font-semibold leading-snug text-gray-900 dark:text-white line-clamp-2">
                        ${article.title}
                    </h3>
                    <p class="mb-2 text-sm text-gray-500 dark:text-gray-400 line-clamp-3">
                        ${article.excerpt}
                    </p>

                    <!-- Contenu complet, replié par défaut -->
                    <div class="kc-full-content" data-content-wrap>
                        <div class="prose prose-sm prose-gray dark:prose-invert max-w-none text-sm text-gray-500 dark:text-gray-400"
                             data-content-body></div>
                    </div>

                    <div class="mt-4 flex items-center justify-between">
                        <button type="button"
                                class="kc-toggle-btn inline-flex items-center gap-1.5 text-sm font-semibold text-primary"
                                data-slug="${article.slug}">
                            <span data-toggle-label>Lire l'article</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="kc-toggle-icon w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>

                        <div class="flex items-center gap-1">
                            <button type="button" class="kc-share-btn kc-share-li" title="Partager sur LinkedIn"
                                    data-share="linkedin">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.15 1.45-2.15 2.94v5.66H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.26 2.37 4.26 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"/>
                                </svg>
                            </button>
                            <button type="button" class="kc-share-btn kc-share-fb" title="Partager sur Facebook"
                                    data-share="facebook">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"/>
                                </svg>
                            </button>
                            <button type="button" class="kc-share-btn kc-share-ig" title="Partager sur Instagram"
                                    data-share="instagram">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
                                    <circle cx="12" cy="12" r="4.2"/>
                                    <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </article>
        `;
    }

    // --- 3. RENDU DE LA GRILLE ---
    async function renderBlog() {
        const grid = document.getElementById('blog-grid');
        const empty = document.getElementById('blog-empty');

        // Affiche immédiatement des squelettes le temps que l'API réponde,
        // plutôt qu'un espace blanc.
        empty.classList.add('hidden');
        renderSkeletons();

        const articles = await getArticles();

        if (!articles.length) {
            grid.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }

        grid.innerHTML = articles.map(articleCardHTML).join('');

        // Garde le contenu complet de chaque article en mémoire (déjà chargé avec la liste)
        const articlesBySlug = Object.fromEntries(articles.map(a => [a.slug, a]));

        grid.querySelectorAll('.kc-toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => toggleArticle(btn, articlesBySlug[btn.dataset.slug]));
        });

        grid.querySelectorAll('.kc-share-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                shareArticle(btn.dataset.share);
            });
        });
    }

    // --- 4. "LIRE PLUS / LIRE MOINS" TOGGLE ---
    async function toggleArticle(btn, article) {
        const card = btn.closest('article');
        const wrap = card.querySelector('[data-content-wrap]');
        const body = card.querySelector('[data-content-body]');
        const label = btn.querySelector('[data-toggle-label]');
        const isOpen = wrap.classList.contains('kc-open');

        if (isOpen) {
            wrap.classList.remove('kc-open');
            btn.classList.remove('kc-toggle-open');
            label.textContent = "Lire l'article";
            return;
        }

        // Va chercher le contenu complet au premier dépliage seulement
        if (!body.innerHTML) {
            body.innerHTML = "<p class=\"italic text-gray-400\">Chargement…</p>";
            try {
                const res = await fetch(`${API_BASE}/articles/${article.slug}`);
                if (!res.ok) throw new Error('Article introuvable');
                const fullArticle = await res.json();
                body.innerHTML = fullArticle.content || "<p>Contenu non disponible.</p>";
            } catch (e) {
                console.error('Erreur chargement article:', e);
                body.innerHTML = "<p>Impossible de charger le contenu pour le moment.</p>";
            }
        }

        wrap.classList.add('kc-open');
        btn.classList.add('kc-toggle-open');
        label.textContent = "Voir moins";
    }

    // --- 5. PARTAGE SOCIAL (simple : lien de la page blog uniquement) ---

    // navigator.clipboard.writeText() exige un contexte sécurisé (HTTPS ou
    // localhost). Sur un domaine en HTTP simple, on retombe sur
    // document.execCommand('copy'), qui fonctionne aussi en HTTP.
    function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise((resolve, reject) => {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                ok ? resolve() : reject();
            } catch (err) {
                reject(err);
            }
        });
    }

    function showToast(message) {
        let toast = document.getElementById('kc-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'kc-toast';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add('kc-show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('kc-show'), 2500);
    }

    function shareArticle(network) {
        const url = window.location.origin + window.location.pathname;

        if (network === 'linkedin') {
            window.open(
                `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,
                'share-li',
                'width=580,height=520'
            );
        } else if (network === 'facebook') {
            window.open(
                `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
                'share-fb',
                'width=580,height=520'
            );
        } else if (network === 'instagram') {
            // Instagram n'a pas d'API de partage web : on copie juste le lien.
            copyToClipboard(url)
                .then(() => showToast('Lien copié ! Collez-le (Ctrl+V) dans votre story ou bio Instagram.'))
                .catch(() => showToast('Impossible de copier le lien automatiquement.'));
        }
    }

    // --- 6. INITIALISATION ---
    renderBlog();
</script>
